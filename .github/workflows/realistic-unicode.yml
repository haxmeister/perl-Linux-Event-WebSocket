name: realistic Unicode WebSocket evaluation

on:
  pull_request:
    paths:
      - 'bench/unicode-one-way.pl'
      - '.github/workflows/realistic-unicode.yml'
      - 'WebSocket.xs'
      - 'lib/Linux/Event/WebSocket/**'

concurrency:
  group: realistic-unicode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unicode-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout optimized bq experiment
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwslay-dev

      - name: Install Linux::Event dependencies
        run: |
          git clone --depth 1 https://github.com/haxmeister/perl-Uniform-HTTP.git /tmp/perl-Uniform-HTTP
          cpanm --notest /tmp/perl-Uniform-HTTP
          git clone --depth 1 https://github.com/haxmeister/perl-linux-event.git /tmp/perl-linux-event
          cpanm --notest /tmp/perl-linux-event
          git clone --depth 1 https://github.com/haxmeister/perl-Linux-Event-HTTP.git /tmp/perl-Linux-Event-HTTP
          cpanm --notest /tmp/perl-Linux-Event-HTTP
          cpanm --installdeps .

      - name: Build optimized bq
        run: |
          perl Makefile.PL
          make

      - name: Build current main
        run: |
          git clone --depth 1 --branch main \
            https://github.com/haxmeister/perl-Linux-Event-WebSocket.git \
            /tmp/websocket-main
          (
            cd /tmp/websocket-main
            perl Makefile.PL
            make
          )

      - name: Build wslay experiment
        run: |
          git clone --depth 1 --branch experiment/wslay-engine \
            https://github.com/haxmeister/perl-Linux-Event-WebSocket.git \
            /tmp/websocket-wslay
          (
            cd /tmp/websocket-wslay
            perl Makefile.PL
            make
          )

      - name: Record environment
        run: |
          {
            uname -a
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket):'
            echo "perl=$(perl -e 'print $^V')"
            echo "main_commit=$(git -C /tmp/websocket-main rev-parse HEAD)"
            echo "wslay_commit=$(git -C /tmp/websocket-wslay rev-parse HEAD)"
            echo "bq_commit=$(git rev-parse HEAD)"
          } | tee realistic-unicode-environment.txt

      - name: Run realistic Unicode comparison
        shell: bash
        run: |
          set -euo pipefail
          : > realistic-unicode.txt

          main="/tmp/websocket-main/blib/lib:/tmp/websocket-main/blib/arch"
          wslay="/tmp/websocket-wslay/blib/lib:/tmp/websocket-wslay/blib/arch"
          bq="$PWD/blib/lib:$PWD/blib/arch"

          run_one() {
            local label="$1"
            local lib="$2"
            shift 2
            printf '%-7s ' "$label" | tee -a realistic-unicode.txt
            PERL5LIB="$lib:${PERL5LIB:-}" \
              perl bench/unicode-one-way.pl "$@" \
              | tee -a realistic-unicode.txt
          }

          run_case() {
            local slot="$1"
            shift
            case "$slot" in
              0)
                run_one main "$main" "$@"
                run_one wslay "$wslay" "$@"
                run_one bq "$bq" "$@"
                ;;
              1)
                run_one wslay "$wslay" "$@"
                run_one bq "$bq" "$@"
                run_one main "$main" "$@"
                ;;
              2)
                run_one bq "$bq" "$@"
                run_one main "$main" "$@"
                run_one wslay "$wslay" "$@"
                ;;
            esac
          }

          profiles=(ascii json-mixed european cjk emoji)
          sizes=(64 1024 16384)

          for round in 1 2; do
            echo "round=$round" | tee -a realistic-unicode.txt
            case_no=0

            for direction in c2s s2c; do
              for profile in "${profiles[@]}"; do
                for bytes in "${sizes[@]}"; do
                  args=(--direction "$direction" --profile "$profile" --bytes "$bytes" --clients 1 --window 32 --seconds 1.5 --warmup 0.4)
                  run_case $(( (case_no + round) % 3 )) "${args[@]}"
                  case_no=$((case_no + 1))
                done
              done
            done

            # Add a realistic concurrent small-message workload.
            for profile in json-mixed cjk emoji; do
              args=(--direction c2s --profile "$profile" --bytes 256 --clients 100 --window 8 --seconds 1.5 --warmup 0.4)
              run_case $(( (case_no + round) % 3 )) "${args[@]}"
              case_no=$((case_no + 1))
            done
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: realistic-unicode
          path: |
            realistic-unicode-environment.txt
            realistic-unicode.txt
