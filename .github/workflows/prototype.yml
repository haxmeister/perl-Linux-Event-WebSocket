name: Prototype boundaries

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  prototype:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.36', '5.44.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build and test patched Net::WebSocket
        run: |
          git clone --depth 1 https://github.com/FGasper/p5-Net-WebSocket.git /tmp/p5-Net-WebSocket
          patch -d /tmp/p5-Net-WebSocket -p1 < contrib/Net-WebSocket-0.24-perl-5.44.patch
          cd /tmp/p5-Net-WebSocket
          cpanm --installdeps .
          perl Makefile.PL
          make
          make test
          make install

      - name: Install project dependencies
        run: |
          git clone --depth 1 https://github.com/haxmeister/perl-Uniform-HTTP.git /tmp/perl-Uniform-HTTP
          cpanm --notest /tmp/perl-Uniform-HTTP
          git clone --depth 1 https://github.com/haxmeister/perl-linux-event.git /tmp/perl-linux-event
          cpanm --notest /tmp/perl-linux-event
          git clone --depth 1 https://github.com/haxmeister/perl-Linux-Event-HTTP.git /tmp/perl-Linux-Event-HTTP
          cpanm --notest /tmp/perl-Linux-Event-HTTP

      - name: Run prototype tests
        run: prove -v prototype/t/01-handshake.t prototype/t/02-net-websocket-adapter.t prototype/t/03-linux-event-stream.t prototype/t/04-http-upgrade.t
