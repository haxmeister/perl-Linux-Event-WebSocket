name: WebSocket high-concurrency comparison

on:
  workflow_dispatch:
  push:
    branches: [ bench/high-concurrency-small-text ]
    paths:
      - '.github/workflows/high-concurrency.yml'
      - 'bench/compare/**'
      - 'WebSocket.xs'
      - 'vendor/bq_websocket/**'
      - 'lib/Linux/Event/WebSocket/**'
      - 'Makefile.PL'

concurrency:
  group: websocket-high-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Install Linux::Event dependencies from main
        run: |
          git clone --depth 1 https://github.com/haxmeister/perl-Uniform-HTTP.git /tmp/perl-Uniform-HTTP
          cpanm --notest /tmp/perl-Uniform-HTTP
          git clone --depth 1 https://github.com/haxmeister/perl-linux-event.git /tmp/perl-linux-event
          cpanm --notest /tmp/perl-linux-event
          git clone --depth 1 https://github.com/haxmeister/perl-Linux-Event-HTTP.git /tmp/perl-Linux-Event-HTTP
          cpanm --notest /tmp/perl-Linux-Event-HTTP
          cpanm --installdeps .

      - name: Install competitor dependencies
        run: |
          cpanm --notest Mojolicious@9.49
          npm install --prefix bench/compare
          (
            cd bench/compare/go
            go get github.com/gorilla/websocket@v1.5.3
            go build -o /tmp/gorilla-websocket-bench .
          )

      - name: Build Linux::Event::WebSocket
        run: |
          perl Makefile.PL
          make

      - name: Expose built XS
        run: echo "PERL5LIB=$PWD/blib/lib:$PWD/blib/arch:${PERL5LIB:-}" >> "$GITHUB_ENV"

      - name: Record versions
        run: |
          perl -MLinux::Event -e 'print "linux_event=$Linux::Event::VERSION\n"'
          perl -Iblib/lib -MLinux::Event::WebSocket -e 'print "websocket=$Linux::Event::WebSocket::VERSION\n"'
          git -C /tmp/perl-linux-event rev-parse HEAD | sed 's/^/linux_event_commit=/'
          uname -a
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket):'

      - name: Run Linux::Event window-depth sweep
        run: bash bench/compare/run-linux-event-window-depth.sh linux-event-window-depth.csv

      - name: Show results
        run: cat linux-event-window-depth.csv

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: websocket-window-depth-diagnostic
          path: linux-event-window-depth.csv
