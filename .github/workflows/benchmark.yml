name: WebSocket benchmarks

on:
  workflow_dispatch:
  push:
    branches: [ main, experiment/raw-buffer-abi ]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'bench/**'
      - 'WebSocket.xs'
      - 'vendor/bq_websocket/**'
      - 'lib/Linux/Event/WebSocket/**'

concurrency:
  group: websocket-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Install Linux::Event dependencies
        run: |
          git clone --depth 1 https://github.com/haxmeister/perl-Uniform-HTTP.git /tmp/perl-Uniform-HTTP
          cpanm --notest /tmp/perl-Uniform-HTTP
          git clone --depth 1 https://github.com/haxmeister/perl-linux-event.git /tmp/perl-linux-event
          cpanm --notest /tmp/perl-linux-event
          git clone --depth 1 https://github.com/haxmeister/perl-Linux-Event-HTTP.git /tmp/perl-Linux-Event-HTTP
          cpanm --notest /tmp/perl-Linux-Event-HTTP
          cpanm --installdeps .

      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Expose built XS
        run: echo "PERL5LIB=$PWD/blib/lib:$PWD/blib/arch:${PERL5LIB:-}" >> "$GITHUB_ENV"

      - name: Build pre-raw ABI baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feature/bq-native-engine \
            https://github.com/haxmeister/perl-Linux-Event-WebSocket.git \
            /tmp/lews-baseline
          cd /tmp/lews-baseline
          perl Makefile.PL
          make

      - name: Record environment
        run: |
          {
            uname -a
            perl -V:version
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket):'
          } | tee benchmark-environment.txt

      - name: Protocol microbenchmark
        env:
          BENCH_SECONDS: '0.6'
        run: perl -Iblib/lib bench/protocol.pl | tee benchmark-protocol.txt

      - name: Historical Perl optimization candidates
        env:
          BENCH_SECONDS: '0.6'
        run: perl -Iblib/lib bench/candidates.pl | tee benchmark-candidates.txt

      - name: Raw input boundary benchmark
        env:
          BENCH_SECONDS: '0.75'
        shell: bash
        run: |
          set -o pipefail
          perl -Iblib/lib bench/raw-input-boundary.pl | tee benchmark-raw-input.txt

      - name: Public application A/B benchmark
        shell: bash
        run: |
          set -euo pipefail
          : > benchmark-application.txt

          for bytes in 256 1024 16384; do
            for repeat in 1 2 3 4 5; do
              PERL5LIB="/tmp/lews-baseline/blib/lib:/tmp/lews-baseline/blib/arch:${PERL5LIB:-}" \
                perl bench/application.pl \
                  --label baseline --bytes "$bytes" \
                  --clients 20 --window 4 --seconds 1.5 \
                  | tee -a benchmark-application.txt

              PERL5LIB="$PWD/blib/lib:$PWD/blib/arch:${PERL5LIB:-}" \
                perl bench/application.pl \
                  --label raw_abi --bytes "$bytes" \
                  --clients 20 --window 4 --seconds 1.5 \
                  | tee -a benchmark-application.txt
            done
          done

      - name: Public API echo benchmark
        shell: bash
        run: |
          : > benchmark-echo.txt

          for type in binary text; do
            for bytes in 64 1024 16384; do
              perl -Iblib/lib bench/echo.pl \
                --type "$type" --bytes "$bytes" \
                --clients 1 --window 32 --seconds 1.5 \
                | tee -a benchmark-echo.txt
            done
          done

          for clients in 10 100; do
            perl -Iblib/lib bench/echo.pl \
              --type binary --bytes 64 \
              --clients "$clients" --window 8 --seconds 1.5 \
              | tee -a benchmark-echo.txt
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: websocket-benchmark-results
          path: |
            benchmark-environment.txt
            benchmark-protocol.txt
            benchmark-candidates.txt
            benchmark-raw-input.txt
            benchmark-application.txt
            benchmark-echo.txt
