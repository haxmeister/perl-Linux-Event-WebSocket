name: bq Perl C API UTF-8 evaluation

on:
  pull_request:
    paths:
      - 'WebSocket.xs'
      - 'lib/Linux/Event/WebSocket/_Engine.pm'
      - 'lib/Linux/Event/WebSocket/Connection.pm'
      - 'bench/one-way.pl'
      - '.github/workflows/bq-perlapi-utf8.yml'

concurrency:
  group: bq-perlapi-utf8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utf8-compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Perl C API experiment
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Install Linux::Event dependencies
        run: |
          git clone --depth 1 https://github.com/haxmeister/perl-Uniform-HTTP.git /tmp/perl-Uniform-HTTP
          cpanm --notest /tmp/perl-Uniform-HTTP
          git clone --depth 1 https://github.com/haxmeister/perl-linux-event.git /tmp/perl-linux-event
          cpanm --notest /tmp/perl-linux-event
          git clone --depth 1 https://github.com/haxmeister/perl-Linux-Event-HTTP.git /tmp/perl-Linux-Event-HTTP
          cpanm --notest /tmp/perl-Linux-Event-HTTP
          cpanm --installdeps .

      - name: Build Perl C API experiment
        run: |
          perl Makefile.PL
          make

      - name: Build Perl-level UTF-8 baseline
        run: |
          git clone --depth 1 --branch experiment/bq-integration-hotpath \
            https://github.com/haxmeister/perl-Linux-Event-WebSocket.git \
            /tmp/websocket-perl-utf8
          (
            cd /tmp/websocket-perl-utf8
            perl Makefile.PL
            make
          )

      - name: Build hand-written native UTF-8 experiment
        run: |
          git clone --depth 1 --branch experiment/bq-native-utf8 \
            https://github.com/haxmeister/perl-Linux-Event-WebSocket.git \
            /tmp/websocket-hand-native
          (
            cd /tmp/websocket-hand-native
            perl Makefile.PL
            make
          )

      - name: Record environment
        run: |
          {
            uname -a
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket):'
            echo "perl=$(perl -e 'print $^V')"
            echo "perl_utf8_commit=$(git -C /tmp/websocket-perl-utf8 rev-parse HEAD)"
            echo "hand_native_commit=$(git -C /tmp/websocket-hand-native rev-parse HEAD)"
            echo "perlapi_commit=$(git rev-parse HEAD)"
          } | tee bq-perlapi-utf8-environment.txt

      - name: Run one-way comparison
        shell: bash
        run: |
          set -euo pipefail
          : > bq-perlapi-utf8.txt

          perl_utf8="/tmp/websocket-perl-utf8/blib/lib:/tmp/websocket-perl-utf8/blib/arch"
          hand_native="/tmp/websocket-hand-native/blib/lib:/tmp/websocket-hand-native/blib/arch"
          perlapi="$PWD/blib/lib:$PWD/blib/arch"

          run_one() {
            local label="$1"
            local lib="$2"
            shift 2
            printf '%-12s ' "$label" | tee -a bq-perlapi-utf8.txt
            env -u LEWS_BQ_BENCH_SKIP_UTF8 \
              PERL5LIB="$lib:${PERL5LIB:-}" \
              perl bench/one-way.pl "$@" \
              | tee -a bq-perlapi-utf8.txt
          }

          run_case() {
            local slot="$1"
            shift
            case "$slot" in
              0)
                run_one perl-utf8 "$perl_utf8" "$@"
                run_one hand-native "$hand_native" "$@"
                run_one perlapi "$perlapi" "$@"
                ;;
              1)
                run_one hand-native "$hand_native" "$@"
                run_one perlapi "$perlapi" "$@"
                run_one perl-utf8 "$perl_utf8" "$@"
                ;;
              2)
                run_one perlapi "$perlapi" "$@"
                run_one perl-utf8 "$perl_utf8" "$@"
                run_one hand-native "$hand_native" "$@"
                ;;
            esac
          }

          for round in 1 2; do
            echo "round=$round" | tee -a bq-perlapi-utf8.txt
            case_no=0

            for direction in c2s s2c; do
              for bytes in 64 16384; do
                args=(--direction "$direction" --type binary --bytes "$bytes" --clients 1 --window 32 --seconds 2 --warmup 0.5)
                run_case $(( (case_no + round) % 3 )) "${args[@]}"
                case_no=$((case_no + 1))
              done

              for bytes in 64 1024 16384; do
                args=(--direction "$direction" --type text --bytes "$bytes" --clients 1 --window 32 --seconds 2 --warmup 0.5)
                run_case $(( (case_no + round) % 3 )) "${args[@]}"
                case_no=$((case_no + 1))
              done
            done
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bq-perlapi-utf8
          path: |
            bq-perlapi-utf8-environment.txt
            bq-perlapi-utf8.txt
